apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-service
  namespace: app
  labels:
    app: delivery-service
    team: greenlogistics
    env: dev
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: delivery-service
  namespace: app
  labels:
    app: delivery-service
    team: greenlogistics
    env: dev
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 10s }
        - setWeight: 50
        - pause: { duration: 10s }
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: delivery-service
        team: greenlogistics
        env: dev
    spec:
      serviceAccountName: delivery-service
      containers:
        - name: delivery-service
          image: ghcr.io/thibauthi/tp_final_dev_cloud/delivery-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_NAME
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: KAFKA_BROKER
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: app
  labels:
    app: delivery-service
    team: greenlogistics
    env: dev
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: delivery-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delivery-service-ingress
  namespace: app
  labels:
    app: delivery-service
    team: greenlogistics
    env: dev
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: delivery-service
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: delivery-service-netpol
  namespace: app
  labels:
    app: delivery-service
    team: greenlogistics
    env: dev
spec:
  podSelector:
    matchLabels:
      app: delivery-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Autoriser le trafic HTTP entrant depuis n'importe où (via Ingress Nginx ou simulator)
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    # Autoriser tout le trafic sortant pour simplifier la communication vers Postgres (db) et Redpanda (messaging)
    # ainsi que Kube-DNS (kube-system)
    - {}

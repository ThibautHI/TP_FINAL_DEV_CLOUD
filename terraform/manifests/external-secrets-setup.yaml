---
# ============================================================================
# ClusterSecretStore — Pont entre External Secrets Operator et Vault
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token
---
# ============================================================================
# ExternalSecret — Synchronise les secrets Vault vers un K8s Secret
# ============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: app
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: api-secret
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: api
        property: db_password
    - secretKey: DB_HOST
      remoteRef:
        key: api
        property: db_host
    - secretKey: DB_USER
      remoteRef:
        key: api
        property: db_user
    - secretKey: DB_NAME
      remoteRef:
        key: api
        property: db_name
    - secretKey: KAFKA_BROKER
      remoteRef:
        key: api
        property: kafka_broker
    - secretKey: SMTP_HOST
      remoteRef:
        key: api
        property: smtp_host
    - secretKey: SMTP_PORT
      remoteRef:
        key: api
        property: smtp_port

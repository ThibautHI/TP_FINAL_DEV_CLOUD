name: CI - GreenLogistics

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

env:
  REGISTRY: ghcr.io

jobs:
  build-test-scan:
    name: Build, Test & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        service: [
          delivery-service,
          gps-ingest-service,
          notification-service,
          gps-simulator
        ]

    steps:
      # 1. Récupération du code
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installation de Bun (exigence de rapidité et support natif de nos apps)
      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Installation et exécution des tests unitaires
      - name: Lancer les tests unitaires
        run: |
          cd services/${{ matrix.service }}
          bun install
          bun test

      # 4. Configuration de Docker Buildx
      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Connexion au GitHub Container Registry (ghcr.io)
      - name: Connexion au registre d'images GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Construction et publication de l'image Docker (Bun runtime)
      - name: Construire et pousser l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Scan de sécurité Trivy (Bloque si CVE HIGH ou CRITICAL)
      - name: Scan CVE avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fait échouer la pipeline s'il y a des failles HIGH/CRITICAL (exigence 4.4)
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # 8. [Étape GitOps] Mise à jour du tag d'image dans le dépôt de déploiement (TP_FINAL_GITOPS)
      # Note : Cette étape est configurée en exemple et s'exécutera une fois le secret GITOPS_PAT ajouté sur GitHub.
      - name: Mettre à jour le dépôt GitOps
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          if [ -z "$GITOPS_PAT" ]; then
            echo "Avertissement : Le secret GITOPS_PAT n'est pas configuré. L'étape de déploiement GitOps est ignorée."
            exit 0
          fi
          
          echo "Clonage du dépôt GitOps..."
          git config --global user.email "ci@ynov.local"
          git config --global user.name "CI Bot"
          
          # Cloner le dépôt GitOps (remplacez avec votre URL de dépôt GitOps final)
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${{ github.repository_owner }}/TP_FINAL_GITOPS.git
          cd TP_FINAL_GITOPS
          
          # Remplacer la version du tag de l'image dans le fichier YAML (ex: deployment.yaml ou values.yaml)
          # Exemple si vous utilisez kustomize ou sed :
          # sed -i "s|image: .*${{ matrix.service }}:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}|g" manifests/${{ matrix.service }}.yaml
          
          # commit et push
          # git commit -am "chore: bump ${{ matrix.service }} to ${{ github.sha }}"
          # git push
